name: Dev Unit Tests

# Fork-local addition (not upstream). Runs the full unit suite on every push to
# `dev` and on PRs into `dev`, so the slow 1800+ test suite never has to run on
# the local 6 GB machine. Kept in its own file so `git merge upstream/dev`
# never conflicts on the upstream workflows.

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: fullDebug unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      # The init script quarantines three known-baseline failures without
      # weakening any test source; edit the list in that file.
      - name: Run fullDebug unit tests
        run: |
          ./gradlew :app:testFullDebugUnitTest \
            -I .github/ci/quarantine-tests.init.gradle.kts \
            --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/testFullDebugUnitTest
          retention-days: 7
